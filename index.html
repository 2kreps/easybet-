<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131d">
  <title>EasyBet — Sports fixtures</title>
  <style>
    :root{color-scheme:dark;--bg:#10131d;--panel:#191f2d;--panel2:#20283a;--text:#f5f7fb;--muted:#9ba6ba;--accent:#8cf0bd;--line:#30394c}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b2940 0,#10131d 55%);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .wrap{width:min(1120px,calc(100% - 32px));margin:auto}.top{padding:28px 0 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{font-weight:900;font-size:29px;letter-spacing:-1.3px}.brand span{color:var(--accent)}.tag{color:var(--muted);font-size:13px}
    .hero{padding:22px 0 24px}.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.08;margin:0 0 8px;letter-spacing:-1.4px}.hero p{margin:0;color:var(--muted)}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.days{display:flex;gap:8px;flex-wrap:wrap}
    button,.search{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:11px 15px;font:inherit}
    button{cursor:pointer;font-weight:700}button.active{background:var(--accent);color:#102019;border-color:var(--accent)}
    .search{flex:1;min-width:190px;outline:none}.sports{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin:14px 0 22px}
    .sport{padding:13px 10px;text-align:center;min-height:52px}.sport.active{background:var(--accent);color:#102019;border-color:var(--accent)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}.section-head h2{font-size:20px;margin:0}.muted{color:var(--muted);font-size:13px}
    .matches{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
    .match{background:linear-gradient(145deg,var(--panel),#151b28);border:1px solid var(--line);border-radius:17px;padding:16px}
    .league{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-bottom:14px}
    .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.team{font-weight:750;display:flex;align-items:center;gap:8px;min-width:0}.team:last-child{justify-content:flex-end;text-align:right}
    .team img{width:27px;height:27px;object-fit:contain}.score{font-weight:900;font-size:20px;white-space:nowrap}.status{margin-top:13px;color:var(--muted);font-size:12px}
    .empty{padding:26px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center;grid-column:1/-1}
    footer{padding:35px 0 45px;color:var(--muted);font-size:12px}
    @media(max-width:560px){.top{padding-top:20px}.brand{font-size:25px}.tag{display:none}.wrap{width:min(100% - 22px,1120px)}button{padding:10px 12px}.sports{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top"><div class="brand">EASY<span>BET</span></div><div class="tag">Your sports. Your fixtures. One place.</div></header>
    <section class="hero">
      <h1>Follow the games.</h1>
      <p>Browse upcoming fixtures and live football scores.</p>
    </section>
    <div class="toolbar">
      <div class="days" id="days">
        <button class="active" data-day="0">Today</button><button data-day="1">Tomorrow</button><button data-day="2">In 2 days</button>
      </div>
      <input id="search" class="search" type="search" placeholder="Search teams or leagues…" aria-label="Search teams or leagues">
    </div>
    <div class="section-head"><h2>Sports</h2><span class="muted">Choose a sport</span></div>
    <nav class="sports" id="sports">
      <button class="sport active" data-sport="football">⚽ Football</button>
      <button class="sport" data-sport="hockey">🏒 Ice hockey</button>
      <button class="sport" data-sport="basketball">🏀 Basketball</button>
      <button class="sport" data-sport="tennis">🎾 Tennis</button>
      <button class="sport" data-sport="american-football">🏈 American football</button>
      <button class="sport" data-sport="baseball">⚾ Baseball</button>
      <button class="sport" data-sport="volleyball">🏐 Volleyball</button>
      <button class="sport" data-sport="handball">🤾 Handball</button>
      <button class="sport" data-sport="combat-sports">🥊 Combat sports</button>
    </nav>
    <div class="section-head"><h2 id="matches-title">Football fixtures</h2><span class="muted" id="date-label"></span></div>
    <main class="matches" id="matches"><div class="empty">Loading fixtures…</div></main>
    <footer>EasyBet is a sports fixtures information site. Match data availability depends on the connected data provider.</footer>
  </div>
<script>
(() => {
  const state = { day: 0, sport: "football", fixtures: [] };
  const $ = id => document.getElementById(id);
  const sportNames = {football:"Football",hockey:"Ice hockey",basketball:"Basketball",tennis:"Tennis","american-football":"American football",baseball:"Baseball",volleyball:"Volleyball",handball:"Handball","combat-sports":"Combat sports"};
  const dateFor = n => { const d=new Date(); d.setDate(d.getDate()+n); return d; };
  const dateParam = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const prettyDate = d => d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  function render(){
    const query=$("search").value.trim().toLowerCase();
    $("matches-title").textContent = sportNames[state.sport] + " fixtures";
    $("date-label").textContent = prettyDate(dateFor(state.day));
    if(state.sport!=="football"){
      $("matches").innerHTML='<div class="empty">Fixtures for this sport are not connected yet. Football fixtures are currently available.</div>';
      return;
    }
    const list=state.fixtures.filter(f=>(f.teams.home.name+" "+f.teams.away.name+" "+(f.league?.name||"")).toLowerCase().includes(query));
    if(!list.length){$("matches").innerHTML='<div class="empty">No fixtures found for this date.</div>';return;}
    $("matches").innerHTML=list.map(f=>{
      const home=f.teams.home, away=f.teams.away, status=f.fixture.status.short;
      const live=["1H","HT","2H","ET","P","LIVE"].includes(status);
      const score=(f.goals.home===null?"–":f.goals.home)+" : "+(f.goals.away===null?"–":f.goals.away);
      const time=new Date(f.fixture.date).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
      return `<article class="match"><div class="league"><span>${f.league?.name||"Football"} · ${f.league?.country||""}</span><span>${live?"LIVE":time}</span></div><div class="teams"><div class="team">${home.logo?`<img src="${home.logo}" alt="">`:""}<span>${home.name}</span></div><div class="score">${score}</div><div class="team">${away.name}${away.logo?`<img src="${away.logo}" alt="">`:""}</div></div><div class="status">${f.fixture.status.long||"Scheduled"}${f.fixture.status.elapsed!==null?" · "+f.fixture.status.elapsed+"'":""}</div></article>`;
    }).join("");
  }
  async function load(){
    $("matches").innerHTML='<div class="empty">Loading fixtures…</div>';
    const d=dateFor(state.day);
    $("date-label").textContent=prettyDate(d);
    if(state.sport!=="football"){render();return;}
    try{
      const res=await fetch(`/.netlify/functions/ottelut?date=${dateParam(d)}`);
      const data=await res.json();
      if(!res.ok) throw new Error(data.error||"Could not load fixtures");
      state.fixtures=data.response||[];
      render();
    }catch(e){$("matches").innerHTML=`<div class="empty">${e.message}. Please check the API connection and try again.</div>`;}
  }
  $("days").addEventListener("click",e=>{const b=e.target.closest("button[data-day]");if(!b)return;state.day=Number(b.dataset.day);document.querySelectorAll("#days button").forEach(x=>x.classList.toggle("active",x===b));load();});
  $("sports").addEventListener("click",e=>{const b=e.target.closest("button[data-sport]");if(!b)return;state.sport=b.dataset.sport;document.querySelectorAll(".sport").forEach(x=>x.classList.toggle("active",x===b));load();});
  $("search").addEventListener("input",render);
  load();
})();
</script>
</body>
</html>
