<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EASYBET — Match Centre</title>
<meta name="description" content="EASYBET Match Centre: live football scores, local kick-off times and data-backed betting tips.">
<meta name="theme-color" content="#050605">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2339ff7a'/%3E%3Cpath d='M20 16h26v8H29v7h14v8H29v9h17v8H20z' fill='%23041008'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./" aria-label="EASYBET home">
      <span class="brand-mark" aria-hidden="true">E</span>
      <span class="brand-word">EASY<b>BET</b></span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Match day">
      <button class="tab" type="button" data-tab="live"><span class="live-dot" aria-hidden="true"></span>Live</button>
      <button class="tab is-active" type="button" data-tab="today">Today</button>
      <button class="tab" type="button" data-tab="tomorrow">Tomorrow</button>
    </nav>
    <div class="tz" id="tz" title="Kick-off times are shown in your local timezone"></div>
  </div>
</header>

<!-- ======================= MATCH LIST ======================= -->
<main id="view-list" class="page">
  <section class="intro">
    <p class="eyebrow">THE GAME STARTS HERE</p>
    <h1 id="list-title">Today’s matches</h1>
    <p class="intro-sub">Major fixtures, local kick-off times and betting tips backed by real data.</p>
  </section>

  <div class="sports" id="sports" role="tablist" aria-label="Sports"></div>
  <p class="sport-note" id="sport-note" role="status" aria-live="polite" hidden></p>

  <div class="list-head">
    <strong id="list-heading">Football</strong>
    <span class="muted" id="list-count"></span>
  </div>
  <div id="matches" aria-live="polite"></div>
</main>

<!-- ======================= MATCH CENTRE (full screen) ======================= -->
<main id="view-match" class="page" hidden>
  <div class="mc-bar">
    <button class="back" id="back" type="button"><span aria-hidden="true">←</span> Back</button>
    <span class="mc-bar-title">MATCH CENTRE</span>
  </div>
  <div id="match-body"></div>
</main>

<footer class="footer">
  <span>BUILT FOR THE LOVE OF THE GAME</span>
  <strong>MADE BY R4JU</strong>
</footer>

<script src="js/app.js" defer></script>
</body>
</html>
